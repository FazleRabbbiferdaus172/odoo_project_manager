[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo_project_manager"
version = "1.0.0"
dependencies = [
    "jinja2"
]

[project.scripts]
odopm = "odoo_project_manager.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]
include = ["src"]
